# Frontend / edge tier — runs on the same EC2 as the backend stack.
# nginx is the single public entrypoint (80/443) and proxies:
#   /     → frontend (this stack)
#   /api/ → backend  (backend stack, reached over the shared network)
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rapid-mail-frontend
    restart: unless-stopped
    networks:
      - rapid-mail-network

  nginx:
    build:
      # Repo root, so the Dockerfile can COPY backend/nginx/nginx.conf.
      context: ..
      dockerfile: infrastructure/nginx/Dockerfile
    container_name: rapid-mail-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/ssl/certs/nginx.crt:/etc/ssl/certs/nginx.crt:ro
      - /etc/ssl/private/nginx.key:/etc/ssl/private/nginx.key:ro
    depends_on:
      - frontend
    networks:
      - rapid-mail-network

# Same fixed-name network as the backend stack — lets nginx resolve `backend`.
# Auto-created/reused by compose, so no manual `docker network create` needed.
networks:
  rapid-mail-network:
    name: rapid-mail-network
    external: true
