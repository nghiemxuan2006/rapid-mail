name: Deploy Frontend

# Runs only when frontend code or the nginx config changes.
# (nginx runs in the frontend stack, even though its conf lives under backend/nginx.)
on:
  push:
    branches: [test, dev]
    paths:
      - 'frontend/**'
      - 'backend/nginx/**'
      - 'infrastructure/nginx/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}

    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Add EC2 to known hosts
        run: ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Write frontend env file
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "cat > /home/ec2-user/rapid-mail/frontend/.env.${{ github.ref_name }} << 'EOF'
          VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_BASE_URL=${{ secrets.VITE_BASE_URL }}
          VITE_MICROSOFT_CLIENT_ID=${{ secrets.VITE_MICROSOFT_CLIENT_ID }}
          EOF"

      - name: Deploy frontend stack
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "BRANCH=${{ github.ref_name }} TARGET=frontend bash /home/ec2-user/rapid-mail/infrastructure/scripts/deploy.sh"
