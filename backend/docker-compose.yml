version: '3.8'

services:
  # MongoDB Service
  mongodb:
    image: mongo:7
    container_name: rapid-mail-mongodb
    restart: unless-stopped
    env_file:
      - .env.test
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - rapid-mail-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rapid-mail-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.test
    environment:
      - FILE_STORAGE_PATH=/data/rapid-mail
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - rapid_mail_data:/data/rapid-mail
    networks:
      - rapid-mail-network
    command: npm start

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  rapid_mail_data:
    driver: local

networks:
  rapid-mail-network:
    driver: bridge
