version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: rapid-mail-mongodb
    restart: unless-stopped
    env_file:
      - .env.test
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - rapid-mail-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rapid-mail-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins
      - ./rabbitmq/plugins:/opt/rabbitmq/plugins
    networks:
      - rapid-mail-network
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rapid-mail-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.test
    environment:
      - FILE_STORAGE_PATH=/data/rapid-mail
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - rapid_mail_data:/data/rapid-mail
    networks:
      - rapid-mail-network
    command: npm start

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  rabbitmq_data:
    driver: local
  rapid_mail_data:
    driver: local

networks:
  rapid-mail-network:
    driver: bridge
